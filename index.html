<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Open in Claude Code</title>
<style>
  :root { --bg: #faf8f5; --fg: #2b2b2b; --muted: #77716a; --card: #ffffff; --line: #e7e1d8; --btn: #2b2b2b; --btn-fg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1c1a; --fg: #ece8e1; --muted: #a39d94; --card: #262522; --line: #3a3833; --btn: #ece8e1; --btn-fg: #1d1c1a; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 620px; padding: 24px 16px; box-sizing: border-box; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  a.btn, button { font: inherit; font-size: 15px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--btn); cursor: pointer; text-decoration: none; }
  a.btn { background: var(--btn); color: var(--btn-fg); }
  button { background: transparent; color: var(--fg); }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 13px; max-height: 55vh; overflow: auto; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Opening Claude Code…</h1>
  <p id="hint">If VS Code didn't open, press the button. On your phone, copy the prompt instead.</p>
  <div class="row">
    <a class="btn" id="go" href="#">Open in VS Code</a>
    <button id="copy" type="button">Copy prompt</button>
  </div>
  <pre id="prompt"></pre>
</main>
<script>
  let prompt = "";
  try { prompt = decodeURIComponent(location.hash.slice(1)); } catch (e) { prompt = ""; }
  const url = "vscode://anthropic.claude-code/open?prompt=" + encodeURIComponent(prompt);
  document.getElementById("go").href = url;
  document.getElementById("prompt").textContent = prompt || "No prompt in this link.";
  document.getElementById("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(prompt); document.getElementById("copy").textContent = "Copied"; }
    catch (e) { document.getElementById("copy").textContent = "Copy failed, select the text"; }
  });
  if (prompt) location.href = url;
</script>
</body>
</html>
